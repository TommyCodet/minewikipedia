<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - MineWiki</title><link rel="stylesheet" href="/style.css">
<style>.admin{max-width:1000px;margin:0 auto;padding:24px 20px}.login-card,.form-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;margin-bottom:16px}input,select,textarea{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:8px;margin:6px 0;font-family:inherit}button{cursor:pointer}.btn-blue{background:#1e5eff;color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700}.btn-red{background:#ef4444;color:#fff;border:0;padding:8px 12px;border-radius:6px}.btn-ghost{background:#fff;border:1px solid #e2e8f0;padding:8px 12px;border-radius:6px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}th{background:#f8fafc} @media(prefers-color-scheme:dark){.login-card,.form-card,.btn-ghost{background:#0b1226!important;color:#e6edff;border-color:#1e2d55}input,select,textarea{background:#0b1226!important;color:#e6edff;border-color:#1e2d55}th{background:#0b1226}}</style></head>
<body><div class="admin">
<div style="display:flex;justify-content:space-between;align-items:center"><h1>MineWiki <span style="color:#1e5eff">Admin</span></h1><a href="/">← Zur Seite</a></div>

<div id="login" class="login-card"><h2>Login</h2><input id="user" placeholder="Benutzername" value="admin"><input id="pass" type="password" placeholder="Passwort"><button class="btn-blue" onclick="login()">Einloggen</button><p id="loginMsg" style="color:red"></p></div>

<div id="panel" style="display:none">
<div class="form-card"><h2 id="formTitle">Neuer Artikel</h2>
<input id="title" placeholder="Titel *"><input id="description" placeholder="Kurzbeschreibung *">
<select id="category"><option>Erze</option><option>Tränke</option><option>Info</option><option>Server</option></select>
<select id="icon"><option value="/icons/diamond-ore.png">Diamant Erz</option><option value="/icons/iron-ore.png">Eisen Erz</option><option value="/icons/ancient-debris.png">Ancient Debris</option><option value="/icons/brewing-stand.png">Braustand</option><option value="/icons/potion-healing.png">Trank Heilung</option><option value="/icons/potion-strength.png">Trank Stärke</option><option value="/icons/grass.png">Grasblock</option></select>
<input id="tags" placeholder="Tags, Komma getrennt"><textarea id="content" rows="10" placeholder="Inhalt (Markdown)..."></textarea>
<input type="file" id="iconFile"><small>Eigener Upload überschreibt Auswahl</small><br><br>
<button class="btn-blue" onclick="save()">Speichern</button> <button class="btn-ghost" onclick="resetForm()">Abbrechen</button><p id="msg"></p></div>

<div class="form-card"><h2>Alle Artikel (<span id="count">0</span>)</h2><table><thead><tr><th>Icon</th><th>Titel</th><th>Kategorie</th><th>URL</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
</div></div>
<script>
let PASS='';
async function login(){const u=document.getElementById('user').value,p=document.getElementById('pass').value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,password:p})});if(!r.ok){document.getElementById('loginMsg').innerText='Falscher Login';return}PASS=p;document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadList();}
async function loadList(){const r=await fetch('/api/artikel');const a=await r.json();document.getElementById('count').innerText=a.length;document.getElementById('list').innerHTML=a.map(x=>`<tr><td><img src="${x.icon}" style="width:32px;height:32px"></td><td><b>${x.title}</b><br><small>${x.description}</small></td><td>${x.category}</td><td>/${x.id}</td><td><button class="btn-ghost" onclick="edit('${x.id}')">Bearbeiten</button> <button class="btn-red" onclick="del('${x.id}')">Löschen</button></td></tr>`).join('');}
async function edit(id){const r=await fetch('/api/admin/artikel/'+id,{headers:{'x-admin-pass':PASS}});const a=await r.json();document.getElementById('title').value=a.title;document.getElementById('description').value=a.description;document.getElementById('category').value=a.category;document.getElementById('icon').value=a.icon;document.getElementById('tags').value=(a.tags||[]).join(', ');document.getElementById('content').value=a.content;document.getElementById('formTitle').innerText='Bearbeiten: '+a.title;window.scrollTo(0,0);}
function resetForm(){['title','description','tags','content'].forEach(i=>document.getElementById(i).value='');document.getElementById('formTitle').innerText='Neuer Artikel';}
async function save(){const fd=new FormData();fd.append('password',PASS);fd.append('title',document.getElementById('title').value);fd.append('description',document.getElementById('description').value);fd.append('category',document.getElementById('category').value);fd.append('icon',document.getElementById('icon').value);fd.append('tags',document.getElementById('tags').value);fd.append('content',document.getElementById('content').value);const f=document.getElementById('iconFile').files[0];if(f)fd.append('icon',f);const r=await fetch('/api/admin/artikel',{method:'POST',body:fd});const j=await r.json();document.getElementById('msg').innerText=r.ok?'Gespeichert: /'+j.id:'Fehler';if(r.ok){resetForm();loadList();}}
async function del(id){if(!confirm('Wirklich löschen: '+id+'?'))return;await fetch('/api/admin/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:PASS,id})});loadList();}
</script></body></html>
